# Every merge to main: run the checks, build the release once, deploy it to dev,
# then wait for approval before deploying that same build to prod.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      import_pubs:
        description: Re-import pubs from OpenStreetMap
        type: boolean
        default: false

# One deploy at a time. A newer merge waits rather than cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # ci.yml's jobs ask for these (plan: id-token and a PR comment, secret scan:
    # pull-requests). GitHub checks permissions up front, so they must be allowed
    # here, even though the plan job only runs on pull requests.
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  # Build once, promote: the API bundles and website are built here, once, and
  # dev and prod both deploy this exact build. Only the settings differ, and
  # deploy.sh adds those at deploy time (web/lib/config.ts).
  build:
    name: Build release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            api/dist
            web/out
          if-no-files-found: error
          retention-days: 30

  dev:
    needs: build
    if: vars.AWS_ACCOUNT_ID != ''
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      import_pubs: ${{ inputs.import_pubs == true }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  prod:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      import_pubs: ${{ inputs.import_pubs == true }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
