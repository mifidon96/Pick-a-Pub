# Checks every pull request: tests, builds, Terraform format and validation,
# and a Terraform plan against prod so you can see what a merge would change.
name: CI

on:
  pull_request:
  workflow_call: # deploy.yml runs these checks before deploying

permissions:
  contents: read

jobs:
  api:
    name: API tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: pickapub_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: test, PGDATABASE: pickapub_test }
    steps:
      - uses: actions/checkout@v7
      - name: Load schema and sample data
        run: psql -v ON_ERROR_STOP=1 -q -f ../db/schema.sql -f ../db/dev_seed.sql
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities (packages that ship to AWS)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: Star rating tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: pickapub_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: test, PGDATABASE: pickapub_test }
    steps:
      - uses: actions/checkout@v7
      - run: psql -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/tests/rating_test.sql

  web:
    name: Website lint and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities (packages that ship to the browser)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "https://api.example.invalid" }
      # Lighthouse scores the built pages. Accessibility uses axe-core under the hood.
      # Accessibility, best practices and SEO below 90 fail the build. Performance
      # only warns: there is no real API here, so it under-scores pages that load data.
      - name: Accessibility, SEO and performance (Lighthouse)
        working-directory: .
        run: |
          rc=0; npx --yes @lhci/cli@0.15.1 autorun || rc=$? # write the scores even if it fails
          jq -r '"### Lighthouse scores", "",
            "| Page | Performance | Accessibility | Best practices | SEO |", "|---|---|---|---|---|",
            (.[] | "| \(.url | sub("http://localhost:[0-9]+"; "")) | \(.summary.performance*100|round) | \(.summary.accessibility*100|round) | \(.summary["best-practices"]*100|round) | \(.summary.seo*100|round) |")' \
            .lighthouseci/reports/manifest.json >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits in a pull request
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # every commit, not just the latest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "~1.13.0" }
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate

  tfscan:
    name: Terraform lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TFLint: mistakes validate misses (unused variables, values AWS would reject).
      - name: TFLint
        env:
          TFLINT_VERSION: v0.62.0
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub rate limits when fetching the AWS plugin
        run: |
          curl -sSL -o /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          sudo unzip -qo /tmp/tflint.zip -d /usr/local/bin
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --chdir=infra --config "$PWD/.tflint.hcl"
          tflint --chdir=infra/bootstrap --config "$PWD/.tflint.hcl"
      # Checkov: security misconfigurations. Accepted findings, with reasons, are in .checkov.yaml.
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Checkov
        run: |
          pip install --quiet checkov==3.3.30
          checkov --config-file .checkov.yaml

  plan:
    name: Terraform plan (prod)
    # Needs the AWS setup from scripts/bootstrap.sh. Pull requests from forks and
    # Dependabot get no AWS access or secrets, so they skip this.
    if: >-
      github.event_name == 'pull_request' && vars.AWS_ACCOUNT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign in to AWS with OIDC
      pull-requests: write # post the plan summary as a comment
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_football_data_api_key: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - name: Build Lambda bundles (Terraform zips them)
        run: cd api && npm ci --no-audit --no-fund && npm run build
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "~1.13.0", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/pickapub-github-plan
          aws-region: eu-west-2
      - name: Plan
        run: |
          set -o pipefail # without this, a failed plan piped into tee would still pass
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=pickapub-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=prod/terraform.tfstate"
          # Read-only role: it cannot take the state lock, and does not need to.
          terraform -chdir=infra plan -input=false -lock=false -no-color \
            -var-file=envs/prod.tfvars -out=tfplan | tee plan.txt

          # Short summary for the PR: the totals and which resources change.
          # The repo is public, so attribute values stay in the job log, not the comment.
          {
            echo "<!-- terraform-plan -->"
            echo "### Terraform plan (prod)"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || echo "See the job log"
            echo '```'
            terraform -chdir=infra show -json tfplan | jq -r '
              [(.resource_changes // [])[] | select(.change.actions != ["no-op"] and .change.actions != ["read"])
               | "| \(.change.actions | join(" then ")) | `\(.address)` |"] as $rows
              | if ($rows | length) == 0 then empty
                else "\n| Action | Resource |\n|---|---|", $rows[:50][], (if ($rows | length) > 50 then "\n...and \($rows | length - 50) more" else empty end)
                end'
            echo
            echo "Full plan: [job log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const body = require("fs").readFileSync("comment.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Update the same comment on each push instead of adding a new one.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes("<!-- terraform-plan -->"));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
