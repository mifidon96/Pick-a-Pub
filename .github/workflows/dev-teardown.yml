# Destroys the dev environment to save money (dev costs about the same as prod).
# The next merge to main, or a manual run of Deploy, recreates it.
name: Tear down dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy dev" to confirm
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Build Lambda bundles (Terraform needs the zips to plan)
        run: cd api && npm ci --no-audit --no-fund && npm run build
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.13.0", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/pickapub-github-deploy-dev
          aws-region: eu-west-2
      - run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=pickapub-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=dev/terraform.tfstate"
          terraform -chdir=infra destroy -input=false -auto-approve -var-file=envs/dev.tfvars
