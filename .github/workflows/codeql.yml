# CodeQL: GitHub's code scanner. Looks for security bugs in the TypeScript
# (injection, unsafe redirects, cross-site scripting) and in these workflow files
# (untrusted input in run steps, over-broad permissions). Findings show under
# Security > Code scanning, and on the pull request that introduced them.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays, to catch newly published vulnerability patterns

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
