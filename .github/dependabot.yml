# Weekly pull requests to keep dependencies up to date. Small updates are
# grouped into one PR per folder. Minor and patch updates to npm packages and
# Terraform providers merge themselves once CI is green
# (workflows/dependabot-automerge.yml); major updates and GitHub Actions
# updates wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Node type definitions follow the Node version we run (22, matching the
      # Lambda runtime and CI), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Node type definitions follow the Node version we run (22, matching the
      # Lambda runtime and CI), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: terraform
    directories: [/infra, /infra/bootstrap]
    schedule: { interval: weekly, day: monday }
    groups:
      providers: { patterns: ["*"] }
